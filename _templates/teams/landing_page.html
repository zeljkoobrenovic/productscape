<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d4ed8'/><rect x='18' y='22' width='30' height='24' rx='4' fill='white'/><rect x='52' y='22' width='30' height='24' rx='4' fill='%2393c5fd'/><rect x='18' y='54' width='64' height='24' rx='4' fill='%23dbeafe'/></svg>">
    <title>${team_name} — Team (${domain_name})</title>
    ${common_style}
    ${tokens_style}
    ${tabs_style}
    ${breadcrumbs_style}
    <style>
        body {
            font-family: Vollkorn, Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
            margin: 8px 28px 28px;
            color: #202124;
            max-width: 1100px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .type-badge {
            display: inline-block;
            padding: 4px 11px;
            border-radius: 999px;
            color: white;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 36px;
            line-height: 1.2;
            margin: 0 0 8px 0;
        }

        .meta {
            color: #6b7280;
            margin-bottom: 18px;
        }

        .description {
            font-size: 18px;
            line-height: 1.55;
            margin-bottom: 22px;
            max-width: 880px;
        }

        .stat-note {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 10px;
        }

        .hc-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .hc-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid rgba(17, 24, 39, 0.12);
        }

        .section {
            border-top: 1px solid #e5e7eb;
            padding-top: 14px;
            margin-top: 20px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            padding: 10px 12px;
            transition: 0.15s;
        }

        .link-card:hover {
            border-color: #9ca3af;
            box-shadow: rgba(0, 0, 0, 0.08) 0 1px 4px;
        }

        .link-card.team {
            border-left-width: 4px;
        }

        .link-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #d7dce1;
            background-color: white;
            flex: none;
        }

        .link-icon.round {
            border-radius: 50%;
            object-fit: cover;
        }

        .link-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex: none;
            margin: 0 9px;
            border: 1px solid rgba(17, 24, 39, 0.12);
        }

        .link-body {
            min-width: 0;
        }

        .link-name {
            color: #1f2937;
            font-size: 15px;
            line-height: 1.25;
        }

        .link-card:hover .link-name {
            color: #1d4ed8;
        }

        .link-meta {
            color: #6b7280;
            font-size: 12px;
            margin-top: 2px;
        }

        .empty-state {
            color: #6b7280;
            font-style: italic;
        }

        .dep-type-group {
            margin-bottom: 16px;
        }

        .dep-type-label {
            display: inline-block;
            font-size: 12px;
            color: #4b5563;
            margin-bottom: 8px;
            padding: 3px 9px;
            border-radius: 999px;
            background-color: #eef2f6;
        }

        .doc-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 8px 8px 0;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            background-color: #f8fafc;
            font-size: 13px;
            color: #1d4ed8;
        }

        .doc-link:hover {
            background-color: #eef2f7;
        }
    </style>
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Ubuntu">
</head>
<body onload="initTab('home-tab')" onhashchange="initTab('home-tab')">
<style>
    .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        align-items: center;
        margin: 2px 0 10px 0;
        padding: 4px 0;
        border-bottom: 1px solid #e5e7eb;
        font-family: Ubuntu, Optima, Segoe, sans-serif;
        font-size: 13px;
    }
    .site-nav a {
        color: #6b7280;
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 6px;
        white-space: nowrap;
    }
    .site-nav a:hover { color: #1d4ed8; background: #eff6ff; }
    .site-nav a.active { color: #1d4ed8; font-weight: 600; background: #dbeafe; }
</style>
<nav class="site-nav"><a href="../../start/index.html">Home</a><a href="../../customers/index.html">Customers</a><a href="../../product-deployments/index.html">Products</a><a href="../../product-bricks/index.html">Bricks &amp; Streams</a><a href="../../teams/index.html" class="active">Teams</a><a href="../../competition/index.html">Competition</a><a href="../../residuality/index.html">Stress Test</a></nav>
<div id="breadcrumbs"></div>
${tabs_script}
<table style="margin-top: 10px">
    <tr>
        <td style="vertical-align: top; padding-top: 0">
            <img src="../icons/logo.png" style="width:96px; height:96px; margin-right:12px" alt="Team">
        </td>
        <td>
            <div id="TypeBadge"></div>
            <h1 id="Title"></h1>
            <div id="Meta" class="meta"></div>
        </td>
    </tr>
</table>

<div class="tab">
    <button class="tablinks" id="tab_home-tab" onclick="openTab('home-tab')">Overview</button>
</div>
<div id="tab_content_home-tab" class="tabcontent"></div>

<script>
    const team = ${team};
    const domainName = '${domain_name}';
    const orgDesign = team.__orgDesign || {};

    const TEAM_TYPE_LABELS = {
        'stream-aligned': 'Stream-aligned',
        'platform': 'Platform',
        'enabling': 'Enabling',
        'complicated-subsystem': 'Complicated subsystem',
        'other': 'Other'
    };
    const TEAM_TYPE_COLORS = {
        'stream-aligned': '#2563eb',
        'platform': '#0891b2',
        'enabling': '#16a34a',
        'complicated-subsystem': '#9333ea',
        'other': '#6b7280'
    };

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function typeColor(typeId) {
        return TEAM_TYPE_COLORS[typeId] || '#6b7280';
    }

    function typeLabel(typeId) {
        return TEAM_TYPE_LABELS[typeId] || typeId || 'team';
    }

    // The generator builds hrefs relative to teams/index.html. Landing pages live one
    // level deeper (teams/landing_pages/), so adjust the prefix accordingly.
    function relink(href) {
        if (!href) return '#';
        if (href.indexOf('landing_pages/') === 0) {
            // sibling team page: landing_pages/<id>.html -> <id>.html
            return href.substring('landing_pages/'.length);
        }
        if (href.indexOf('../') === 0) {
            // ../customers/... or ../product-bricks/... -> ../../...
            return '../' + href;
        }
        return href;
    }

    function renderLinkCards(items, iconBase, options) {
        options = options || {};
        if (!items || !items.length) {
            return '<div class="empty-state">' + escapeHtml(options.empty || 'None linked.') + '</div>';
        }
        let html = '<div class="link-grid">';
        items.forEach(item => {
            const extraClass = options.team ? ' team' : '';
            const style = options.team ? ' style="border-left-color:' + typeColor(item.type) + '"' : '';
            html += '<a class="link-card' + extraClass + '"' + style + ' target="_blank" href="' + escapeHtml(relink(item.href)) + '">';
            if (options.noIcon) {
                // internal teams have no icon; show a type-colored dot instead of a broken image
                html += '<span class="link-dot" style="background-color:' + typeColor(item.type) + '"></span>';
            } else {
                const iconClass = 'link-icon' + (options.round ? ' round' : '');
                const fallback = iconBase + (options.fallbackIcon || 'logo.png');
                html += '<img class="' + iconClass + '" src="' + escapeHtml(iconBase + (item.icon || '')) + '" onerror="this.onerror=null;this.src=\'' + fallback + '\'">';
            }
            html += '<div class="link-body">';
            html += '<div class="link-name">' + escapeHtml(item.name) + '</div>';
            const meta = options.metaBuilder ? options.metaBuilder(item) : (item.description || '');
            if (meta) {
                html += '<div class="link-meta">' + escapeHtml(meta) + '</div>';
            }
            html += '</div></a>';
        });
        html += '</div>';
        return html;
    }

    function renderSection(title, body) {
        return '<div class="section"><div class="section-title">' + escapeHtml(title) + '</div>' + body + '</div>';
    }

    function renderTeamDependencies(items) {
        if (!items || !items.length) {
            return '<div class="empty-state">No related teams.</div>';
        }
        const byType = {};
        const order = [];
        items.forEach(item => {
            const key = item.dependencyTypeName || item.dependencyType || 'Related';
            if (!byType[key]) { byType[key] = []; order.push(key); }
            byType[key].push(item);
        });
        let html = '';
        order.forEach(key => {
            html += '<div class="dep-type-group">';
            html += '<div class="dep-type-label">' + escapeHtml(key) + '</div>';
            html += renderLinkCards(byType[key], '', {
                team: true,
                noIcon: true,
                metaBuilder: item => [item.groupName || '', typeLabel(item.type)].filter(Boolean).join(' | ')
            });
            html += '</div>';
        });
        return html;
    }

    // header
    document.getElementById('TypeBadge').innerHTML =
        '<span class="type-badge" style="background-color:' + typeColor(team.type) + '">' + escapeHtml(typeLabel(team.type)) + '</span>';
    document.getElementById('Title').innerHTML = escapeHtml(team.name || 'Team');
    document.getElementById('Meta').innerHTML =
        escapeHtml(domainName) + ' | ' + escapeHtml(team.groupName || '');

    const hc = (team.teamHeadcount || {});
    let html = '';

    if (team.description) {
        html += '<div class="description">' + escapeHtml(team.description) + '</div>';
    }

    const headcount = Math.max(Number(hc.headcount) || 0, 0);
    let sizeBody = '';
    if (headcount) {
        let dots = '';
        for (let i = 0; i < headcount; i++) {
            dots += '<span class="hc-dot" style="background-color:' + typeColor(team.type) + '"></span>';
        }
        sizeBody += '<div class="hc-dots">' + dots + '</div>';
    } else {
        sizeBody += '<div class="empty-state">Headcount not set.</div>';
    }
    if (hc.description) {
        sizeBody += '<div class="stat-note">' + escapeHtml(hc.description) + '</div>';
    }
    html += renderSection('Team Size (' + escapeHtml(String(headcount)) + ' FTE)', sizeBody);

    html += renderSection('Customers (' + (team.customerDependencies || []).length + ')',
        renderLinkCards(team.customerDependencies || [], '../../customers/icons/', {
            round: true, fallbackIcon: 'customer.png', empty: 'No customers linked.'
        }));

    html += renderSection('Product Streams (' + (team.streamDependencies || []).length + ')',
        renderLinkCards(team.streamDependencies || [], '../../product-bricks/icons/', {
            fallbackIcon: 'brick.png', empty: 'No streams linked.'
        }));

    html += renderSection('Product Bricks (' + (team.brickDependencies || []).length + ')',
        renderLinkCards(team.brickDependencies || [], '../../product-bricks/icons/', {
            fallbackIcon: 'brick.png', empty: 'No product bricks linked.'
        }));

    html += renderSection('Related Teams (' + (team.otherTeamDependencies || []).length + ')',
        renderTeamDependencies(team.otherTeamDependencies || []));

    if ((team.documentLinks || []).length) {
        let docs = '';
        (team.documentLinks || []).forEach(doc => {
            docs += '<a class="doc-link" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(doc.url || '#') + '">&#128279; ' + escapeHtml(doc.title || doc.url || 'Document') + '</a>';
        });
        html += renderSection('Documents (' + (team.documentLinks || []).length + ')', docs);
    }

    document.getElementById('tab_content_home-tab').innerHTML = html;
</script>
${breadcrumbs_script}
</body>
</html>
