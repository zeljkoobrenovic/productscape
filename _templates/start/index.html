<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d4ed8'/><rect x='18' y='22' width='30' height='24' rx='4' fill='white'/><rect x='52' y='22' width='30' height='24' rx='4' fill='%2393c5fd'/><rect x='18' y='54' width='64' height='24' rx='4' fill='%23dbeafe'/></svg>">
    <title>${domain_name}</title>
    <style>
        body {
            font-family: Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
            text-align: center;
        }

        .group {
            display: inline-block;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 5px;
            background-color: #f8f8f8;
        }

        .group-title {
            font-size: 90%;
            margin-top: 4px;
            color: grey;
        }

        .app {
            margin: 10px;
            padding-top: 10px;
            border: solid lightgrey 1px;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 3px 10px 0 rgba(0, 0, 0, 0.19);
            display: inline-block;
            height: 320px;
            width: 230px;
            object-fit: cover;
            text-align: center;
            vertical-align: top;
            border-radius: 12px;
            background-color: white;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
            margin-top: 12px;
            color: #5009DC;
            overflow: hidden;
            padding-left: 8px;
            padding-right: 8px;
        }

        .source {
            font-size: 11px;
            color: grey;
            margin: 3px;
        }

        .description {
            font-size: 14px;
            color: grey;
            margin: 3px;
            line-height: 21px;
            padding-left: 8px;
            padding-right: 8px;
        }

        .domain-intro {
            max-width: 1024px;
            margin: 10px auto 36px;
        }

        .domain-description {
            font-size: 20px;
            line-height: 1.5;
            color: #8c8c8c;
            overflow-wrap: anywhere;
        }

        .domain-description-toggle {
            padding: 0;
            border: 0;
            background: none;
            color: var(--accent-ink);
            font: inherit;
            white-space: nowrap;
            cursor: pointer;
            font-size: 90%;
        }

        .domain-description-toggle:hover,
        .domain-description-toggle:focus-visible {
            text-decoration: underline;
        }

        a {
            text-decoration: none;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 4px;
            margin-top: 26px;
            margin-bottom: 20px;
            filter: grayscale(100%);
        }

    </style>
    ${tokens_style}
    ${tabs_style}
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Ubuntu">
    ${tabs_script}
    <script>
        const START_TAB_STORAGE_KEY = 'productscape:start-active-tab';

        // Persist the last opened tab (shared tabs script calls this hook after opening).
        window.afterOpenTab = function (tabName) {
            window.sessionStorage.setItem(START_TAB_STORAGE_KEY, tabName);
        };
    </script>
</head>
<body>
<style>
    .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        align-items: center;
        margin: 2px 0 10px 0;
        padding: 4px 0;
        border-bottom: 1px solid #e5e7eb;
        font-family: Ubuntu, Optima, Segoe, sans-serif;
        font-size: 13px;
    }

    .site-nav a {
        color: #6b7280;
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 6px;
        white-space: nowrap;
    }

    .site-nav a:hover {
        color: #1d4ed8;
        background: #eff6ff;
    }

    .site-nav a.active {
        color: #1d4ed8;
        font-weight: 600;
        background: #dbeafe;
    }
</style>
<nav class="site-nav" id="siteNav" style="margin-left: 20px"><a href="../start/index.html" class="active">Home</a><a href="../customers/index.html">Customers</a><a
        href="../product-deployments/index.html">Products</a><a
        href="../product-bricks/index.html">Bricks &amp; Streams</a><a href="../teams/index.html">Teams</a><a href="../competition/index.html">Competition</a>${domain_nav_links}</nav>
<div style="margin: 40px">
    <div style="margin-top: 10px"><img src="icons/logo.png" style="height: 164px; border: 1px solid lightgrey; border-radius: 20px; padding: 12px; margin: 8px;"></div>
    <div style="margin: 8px; margin-top: 0; font-size: 52px; color: #8c8c8c">${domain_name}</div>
    <div class="domain-intro">
        <div class="domain-description">
            <span id="domain-description">${domain_description}</span>
            <button id="domain-description-toggle" class="domain-description-toggle" type="button"
                    aria-expanded="false" aria-controls="domain-description" hidden>...</button>
        </div>
    </div>
    <div style="margin: -10px; padding: 6px" id="search_container">
        <div style="margin-bottom: 30px; color: grey">
            <input id="filter_all" type="text" placeholder="search..."
                   style="font-size: 16px; height: 32px; width: 320px"
                   onkeyup="update()">
            <span id="summary_all"></span>
        </div>
        <div id="content_search"></div>
    </div>

    <div class="tab" id="tab_navigation">
    </div>

    <div id="tab_content"></div>

    <script>
        const apps = ${apps}.apps;
        const config = ${apps}.config;
        // Global navigation is optional on start pages (config.showGlobalNav in
        // apps.json); package launchers outside a domain turn it off because the
        // per-area links only resolve inside a domain folder.
        if (config.showGlobalNav === false) {
            const siteNav = document.getElementById('siteNav');
            if (siteNav) siteNav.style.display = 'none';
        }
        let tabNavigationHtml = '';
        let tabContentHtml = '';
        apps.forEach(tab => {
            tabNavigationHtml += '<button id="tab_' + tab.tab + '" class="tablinks" onclick="openTab(\'' + tab.tab + '\')">' + tab.tab + '</button>';

            tabContentHtml += '<div id="tab_content_' + tab.tab + '" class="tabcontent" style="margin: 0; padding: 6px;">' +
                '<div id="content_' + tab.tab + '"></div>' +
                '</div>';
        });

        document.getElementById('tab_navigation').innerHTML = tabNavigationHtml;
        document.getElementById('tab_content').innerHTML = tabContentHtml;

        // Default to the first tab, but prefer the last opened tab (URL hash wins over both,
        // resolved inside the shared initTab).
        const storedStartTab = window.sessionStorage.getItem(START_TAB_STORAGE_KEY);
        const defaultStartTab = (storedStartTab && document.getElementById('tab_' + storedStartTab))
            ? storedStartTab
            : (apps.length ? apps[0].tab : '');
        initTab(defaultStartTab);
    </script>

    <script>
        // Pre-build a flat list with pre-lowercased fields for search
        const allApps = [];
        apps.forEach(tab => {
            tab.apps.forEach(group => {
                group.apps.forEach(app => {
                    allApps.push({
                        app: app,
                        name: (app.name || '').toLowerCase(),
                        description: (app.description || '').toLowerCase(),
                        source: (app.source || '').toLowerCase()
                    });
                });
            });
        });

        function renderAppCard(app) {
            let html = '<div class="app">';
            if (config.openInNewTab === false || app.openInNewTab === false) {
                html += '<a href="' + app.link + '">';
            } else {
                html += '<a target="_blank" href="' + app.link + '">';
            }
            html += '<div style="height: 38px">';
            html += '<div class="name">' + app.name + '</div>';
            if (app.source) {
                html += '<div class="source">source: ' + app.source + '</div>';
            } else {
                html += '<div class="source"></div>';
            }
            html += '</div>';
            html += '<div><img class="icon" src="' + app.icon + '"></div>';
            html += '<div class="description">' + app.description + '</div>';
            html += '</a>';
            html += '</div>';
            return html;
        }

        function renderTabs() {
            apps.forEach(tab => {
                let html = '';
                tab.apps.forEach(group => {
                    html += '<div class="group">';
                    html += '<div class="group-title">' + group.group + '</div>';
                    group.apps.forEach(app => {
                        html += renderAppCard(app);
                    });
                    html += '</div>';
                });
                document.getElementById('content_' + tab.tab).innerHTML = html;
            });
        }

        function update() {
            const filterText = document.getElementById('filter_all').value.trim().toLowerCase();

            if (filterText) {
                document.getElementById('tab_navigation').style.display = 'none';
                document.getElementById('tab_content').style.display = 'none';
                document.getElementById('content_search').style.display = 'block';

                let html = '';
                let count = 0;
                allApps.forEach(entry => {
                    if (entry.name.includes(filterText) || entry.description.includes(filterText) || entry.source.includes(filterText)) {
                        html += renderAppCard(entry.app);
                        count++;
                    }
                });
                document.getElementById('content_search').innerHTML = html;
                document.getElementById('summary_all').innerHTML = ' = ' + count + ' app' + (count !== 1 ? 's' : '');
            } else {
                document.getElementById('tab_navigation').style.display = '';
                document.getElementById('tab_content').style.display = '';
                document.getElementById('content_search').style.display = 'none';
                document.getElementById('summary_all').innerHTML = '';
            }
        }

        if (!config || !config.enableSearch) {
            document.getElementById('search_container').style.display = 'none';
        }

        renderTabs();
    </script>

    <script>
        const domainDescription = document.getElementById('domain-description');
        const domainDescriptionToggle = document.getElementById('domain-description-toggle');
        const descriptionContainer = domainDescription.parentElement;
        const fullDomainDescription = domainDescription.cloneNode(true);
        const fullDescriptionText = fullDomainDescription.textContent;

        function showDescriptionPrefix(length) {
            // Keep links and formatting when shortening the description.
            const range = document.createRange();
            range.selectNodeContents(fullDomainDescription);
            const walker = document.createTreeWalker(fullDomainDescription, NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
                if (length <= node.length) {
                    range.setEnd(node, length);
                    break;
                }
                length -= node.length;
            }
            domainDescription.replaceChildren(range.cloneContents());
        }

        function updateDescriptionToggle() {
            const wasExpanded = domainDescriptionToggle.getAttribute('aria-expanded') === 'true';
            const maxHeight = 2 * parseFloat(getComputedStyle(descriptionContainer).lineHeight);
            showDescriptionPrefix(fullDescriptionText.length);
            domainDescriptionToggle.hidden = true;
            const overflows = descriptionContainer.scrollHeight > maxHeight + 1;
            domainDescriptionToggle.hidden = !overflows;
            const expanded = wasExpanded && overflows;
            domainDescriptionToggle.setAttribute('aria-expanded', String(expanded));
            domainDescriptionToggle.textContent = expanded ? '<<' : '...';
            if (!overflows || expanded) return;

            // Find the longest prefix that leaves room for the inline button on line two.
            let low = 0;
            let high = fullDescriptionText.length;
            while (low < high) {
                const middle = Math.ceil((low + high) / 2);
                showDescriptionPrefix(middle);
                if (descriptionContainer.scrollHeight <= maxHeight + 1) {
                    low = middle;
                } else {
                    high = middle - 1;
                }
            }
            // Prefer ending at a whole word when the next character continues it.
            let prefix = fullDescriptionText.slice(0, low);
            if (/\S/.test(fullDescriptionText.charAt(low))) {
                const wordBoundary = prefix.search(/\s+\S*$/);
                if (wordBoundary > 0) prefix = prefix.slice(0, wordBoundary);
            }1
            showDescriptionPrefix(prefix.trimEnd().length);
        }

        domainDescriptionToggle.addEventListener('click', () => {
            const expanded = domainDescriptionToggle.getAttribute('aria-expanded') === 'true';
            domainDescriptionToggle.setAttribute('aria-expanded', String(!expanded));
            updateDescriptionToggle();
        });
        window.addEventListener('resize', updateDescriptionToggle);
        updateDescriptionToggle();
        if (document.fonts) document.fonts.ready.then(updateDescriptionToggle);
    </script>
</div>
</body>
</html>
