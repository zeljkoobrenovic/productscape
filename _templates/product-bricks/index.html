<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d4ed8'/><rect x='18' y='22' width='30' height='24' rx='4' fill='white'/><rect x='52' y='22' width='30' height='24' rx='4' fill='%2393c5fd'/><rect x='18' y='54' width='64' height='24' rx='4' fill='%23dbeafe'/></svg>">
    <title>Product Bricks (${domain_name})</title>

    ${breadcrumbs_style}
    ${tokens_style}
    ${tabs_style}

    <style>
        body {
            font-family: Vollkorn, Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
            margin-left: 28px;
            margin-right: 28px;
            margin-bottom: 28px;
            color: #202124;
            --text-color: #111;
            --surface-muted: #f0f0f0;
            --surface-fallback: #f3f3f3;
            --group-border: lightgrey;
            --card-shadow: rgba(0, 0, 0, 0.12) 0px 1px 3px, rgba(0, 0, 0, 0.24) 0px 1px 2px;
            --highlight-color: crimson;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .section-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .section-link {
            display: inline-block;
            padding: 8px 14px;
            color: #4b5563;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            background-color: #f8fafc;
            transition: 0.3s;
        }

        .section-link:hover {
            background-color: #eef2f7;
            border-color: #9ca3af;
        }

        .section-link.active {
            background-color: #202124;
            border-color: #202124;
            color: white;
        }

        .hero {
            margin-bottom: 14px;
        }

        .hero-table {
            border-collapse: collapse;
            width: auto;
        }

        .hero-logo {
            width: 108px;
            height: 108px;
            margin-right: 12px;
        }

        .hero-logo-cell {
            border: none;
            vertical-align: top;
            padding-top: 12px;
            padding-right: 12px;
        }

        .hero-copy-cell {
            vertical-align: top;
            border: none;
        }

        .hero-title {
            font-size: 64px;
            margin-bottom: 4px;
        }

        .hero-subtitle {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 14px;
            max-width: 960px;
            line-height: 1.4;
        }

        .bricks-panel {
            padding: 18px;
            background-color: white;
        }

        .bricks-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
            margin-bottom: 18px;
        }

        .brick-search {
            flex: 1;
            min-width: 220px;
            max-width: 520px;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #202124;
        }

        .brick-search-summary {
            font-size: 13px;
            color: #6b7280;
            margin: -8px 0 12px 0;
            min-height: 16px;
        }

        .bricks-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4b5563;
        }

        .bricks-toggle input {
            margin: 0;
        }

        .bricks-status-filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .bricks-status-filter {
            padding: 4px 8px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            background-color: #f8fafc;
        }

        .status-swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 999px;
            border: 1px solid rgba(17, 17, 17, 0.16);
        }

        .map {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .map-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            overflow-x: auto;
        }

        .domain-column {
            min-width: 220px;
            width: 100%;
        }

        .domain-title {
            background-color: var(--surface-muted);
            font-size: 12px;
            padding: 4px;
            text-align: center;
        }

        .domain-groups {
            text-align: center;
        }

        .group {
            border: 1px dashed var(--group-border);
            display: inline-block;
            margin: 4px;
            vertical-align: top;
        }

        .group-title {
            font-size: 80%;
            margin-top: 12px;
        }

        .group-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .brick-card {
            margin: 4px;
            padding: 4px;
            font-size: 12px;
            width: 140px;
            max-width: 144px;
            box-sizing: border-box;
            overflow: hidden;
            background-color: var(--surface-fallback);
            box-shadow: var(--card-shadow);
            text-align: left;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            border: 1px solid black;
        }

        .brick-card-main {
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }

        .brick-card.highlighted {
            border: 4px solid var(--highlight-color);
        }

        .brick-icon {
            width: 36px;
        }

        .brick-name {
            overflow: hidden;
            width: calc(100% - 40px);
        }

        .brick-name-title {
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .brick-structure-list {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            width: 100%;
            margin-top: auto;
        }

        .brick-structure-card {
            display: block;
            padding: 4px 5px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            background: rgba(255, 255, 255, 1.00);
            font-size: 9px;
            line-height: 1.05;
            width: 100%;
        }

        .brick-structure-card.structure-ui {
            border-color: black;
        }

        .brick-structure-card.structure-interfaces {
            border-color: black;
        }

        .brick-structure-card.structure-worker {
            border-color: black;
        }

        .brick-structure-card.structure-stateless-service {
            border-color: black;
        }

        .brick-structure-card.structure-service {
            border-color: black;
        }

        .brick-structure-card.structure-integration {
            border-color: black;
        }

        .brick-structure-card .structure-card-type {
            font-size: 8px;
            text-transform: uppercase;
            color: #4b5563;
            white-space: nowrap;
        }

        .brick-structure-card .structure-card-name {
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #111827;
        }

        .legend {
            width: 160px;
            padding: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 80%;
            display: inline-block;
        }

        .legend-title {
            margin-bottom: 3px;
        }

        .legend-item {
            padding: 8px;
        }

        .dependencies-panel {
            padding: 18px;
            background-color: white;
        }

        .dependency-subtabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .dependency-subtab {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #374151;
            cursor: pointer;
            font-size: 13px;
            padding: 8px 12px;
        }

        .dependency-subtab.active {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
            color: white;
        }

        .streams-panel {
            padding: 18px;
            background-color: white;
        }

        .data-panel {
            padding: 18px;
            background-color: white;
        }

        .data-options {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 12px;
        }

        .data-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
        }

        .data-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .data-group {
            padding-top: 16px;
            margin-top: 18px;
            border-top: 1px solid #e5e7eb;
        }

        .data-group:first-child {
            margin-top: 0;
        }

        .data-group-depth-1 {
            margin-left: 14px;
            padding-left: 14px;
            border-left: 3px solid #e5e7eb;
        }

        .data-group-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 6px;
        }

        .data-group-title {
            font-size: 22px;
            color: #111827;
        }

        .data-group-count {
            color: #6b7280;
            font-size: 13px;
        }

        .data-group-description {
            color: #4b5563;
            line-height: 1.45;
            margin-bottom: 12px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .data-card {
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background-color: #f8fafc;
            padding: 14px;
        }

        .data-card-title {
            font-size: 20px;
            color: #1d4ed8;
            margin-bottom: 6px;
        }

        .data-card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .data-card-icon {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            background-color: white;
            padding: 4px;
            flex: 0 0 auto;
        }

        .data-card-copy {
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .data-card-subtitle {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .data-store-list,
        .data-meta-list {
            margin: 0;
            padding-left: 18px;
            color: #374151;
        }

        .data-store-list li,
        .data-meta-list li {
            margin-bottom: 6px;
        }

        .streams-toolbar {
            margin-bottom: 18px;
        }

        .streams-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4b5563;
        }

        .streams-toggle input {
            margin: 0;
        }

        .streams-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .stream-area {
            display: inline-block;
            margin-bottom: 24px;
            vertical-align: top;
            border: 1px dashed black;
            border-radius: 10px;
            padding: 12px;
        }

        .stream-area-title {
            font-size: 24px;
            color: blue;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 8px;
        }

        .stream-group-title {
            font-size: 18px;
            color: blue;
            margin: 8px;
            font-weight: 700;
        }

        .stream-group-copy {
            font-size: 12px;
            color: #6b7280;
            margin: 0 8px 8px 8px;
        }

        .stream-depth-1 {
            display: block;
            margin: 10px;
            border-color: #d1d5db;
        }

        .stream-depth-2 {
            display: block;
            margin: 10px;
            border-color: #e5e7eb;
        }

        .stream-grid {
            display: inline-block;
            margin: 6px;
        }

        .stream-card {
            display: inline-block;
            border: 1px solid grey;
            border-radius: 12px;
            padding: 16px;
            box-shadow: rgba(0, 0, 0, 0.05) 0px 4px 12px;
            margin: 12px;
            width: 320px;
            vertical-align: top;
        }

        .stream-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .stream-card-icon {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 10px;
            background: white;
            padding: 4px;
            flex: 0 0 auto;
        }

        .stream-card-title {
            font-size: 20px;
            color: black;
            margin-bottom: 0;
        }

        .stream-card-copy {
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 12px;
            font-size: 80%;
        }

        .stream-card-subtitle {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .stream-list {
            margin: 0;
            padding-left: 18px;
            color: #374151;
        }

        .stream-list li {
            margin-bottom: 6px;
        }

        .stream-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stream-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            border-radius: 9px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            background-color: #f8fafc;
            color: #202124;
        }

        .stream-pill.external {
            border-color: #bbf7d0;
            background-color: #f0fdf4;
            color: #166534;
        }

        .stream-pill img {
            width: 28px;
            height: 28px;
        }

        .dependencies-layout {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .dependency-controls {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f8fafc;
            padding: 14px;
        }

        .dependency-control-group {
            margin-bottom: 18px;
        }

        .dependency-top-options {
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 16px;
            padding-bottom: 12px;
        }

        .dependency-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #374151;
            font-size: 13px;
        }

        .dependency-option input {
            margin: 0;
        }

        .dependency-control-title {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .dependency-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .dependency-action {
            border: 1px solid #d1d5db;
            border-radius: 999px;
            background-color: white;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .dependency-checklist {
            max-height: 260px;
            overflow: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background-color: white;
            padding: 8px;
        }

        .dependency-check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            font-size: 13px;
            border-bottom: 1px solid #f3f4f6;
        }

        .dependency-check-item:last-child {
            border-bottom: none;
        }

        .dependency-check-item input {
            margin: 0;
        }

        .dependency-check-meta {
            color: #6b7280;
            font-size: 11px;
        }

        .dependency-graph-shell {
            min-width: 0;
        }

        .dependency-node-legend {
            border-top: 1px solid #e5e7eb;
            padding-top: 14px;
            margin-top: 6px;
        }

        .dependency-node-legend-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dependency-node-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .dependency-node-legend-swatch {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid #9ca3af;
            flex: 0 0 auto;
        }

        .dependency-controls-column {
            min-width: 0;
        }

        .dependency-labels-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
        }

        .dependency-graph-summary {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }

        .dependency-graph-summary strong {
            color: #1f2937;
        }

        .dependency-view-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .dependency-view-btn {
            border: 1px solid #d1d5db;
            background-color: #f8fafc;
            color: #4b5563;
            border-radius: 999px;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .dependency-view-btn:hover {
            background-color: #eef2f7;
            border-color: #9ca3af;
        }

        .dependency-view-btn.active {
            background-color: #202124;
            border-color: #202124;
            color: white;
        }

        .dependency-graph-stat {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 8px;
        }

        .dependency-graph-stat-value {
            font-size: 14px;
            color: #1d4ed8;
        }

        .activity-muted {
            color: #6b7280;
            font-size: 90%;
        }

        .empty-state {
            color: #6b7280;
            font-style: italic;
        }

        .dependency-graph-stat-label {
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .dependency-graph {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            padding: 14px;
            overflow: auto;
            min-height: 560px;
        }

        .dependency-graph.force {
            padding: 0;
            overflow: hidden;
            height: 620px;
        }

        .dependency-empty {
            color: #6b7280;
            font-style: italic;
        }

        .matrix-panel {
            padding: 18px;
            background-color: white;
        }

        .matrix-layout {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .matrix-controls {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f8fafc;
            padding: 14px;
        }

        .matrix-shell {
            min-width: 0;
        }

        .matrix-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .matrix-table-wrap {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            overflow: auto;
            max-height: 75vh;
        }

        .matrix-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }

        .matrix-table th,
        .matrix-table td {
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #f3f4f6;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        .matrix-table th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 1;
        }

        .matrix-row-head {
            position: sticky;
            left: 0;
            background-color: white;
            min-width: 220px;
            text-align: left;
            z-index: 1;
        }

        .matrix-corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 2;
            background-color: #f8fafc;
            min-width: 220px;
            text-align: left;
        }

        .matrix-col-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .matrix-col-count {
            font-size: 10px;
            color: #6b7280;
            min-width: 24px;
        }

        .matrix-row-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 80%;
            text-align: left;
        }

        .matrix-row-count {
            margin-left: auto;
            font-size: 11px;
            color: #6b7280;
            padding-left: 8px;
            white-space: nowrap;
        }

        .matrix-row-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .matrix-hit {
            background-color: #dbeafe;
            color: #1e3a8a;
            font-size: 11px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-hit-external {
            background-color: #ecfccb;
            color: #365314;
            font-size: 10px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-empty-cell {
            color: #d1d5db;
        }

        @media (max-width: 1080px) {
            .dependencies-layout {
                grid-template-columns: 1fr;
            }

            .matrix-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/force-graph@1.51.4/dist/force-graph.min.js"></script>
    <script>
        function updateTabLabels() {
            const brickCount = getBrickCatalog().length;
            const streamCount = getStreamCatalogItems().length;
            const dataAssetCount = (dataAssetsPayload.assets || []).length;
            document.getElementById('tab_bricks').textContent = 'Bricks (' + brickCount + ')';
            document.getElementById('tab_streams').textContent = 'Streams (' + streamCount + ')';
            document.getElementById('tab_data').textContent = 'Data (' + dataAssetCount + ')';
        }

        // The shared tabs script (_imports/tabs) calls this hook after a tab opens.
        // Render the lazily-built views for the tab that just became visible.
        window.afterOpenTab = function (tabName) {
            if (tabName === 'dependencies') {
                renderDependenciesView();
            } else if (tabName === 'streams') {
                renderStreamsView();
            } else if (tabName === 'data') {
                renderDataView();
            }
        };

        function scrollPageToTop() {
            window.scrollTo(0, 0);
            requestAnimationFrame(() => window.scrollTo(0, 0));
            setTimeout(() => window.scrollTo(0, 0), 0);
        }

        const bricksPayload = ${bricks};
        const streamsPayload = ${product_streams};
        const dataAssetsPayload = ${data_assets};
        const bricksMetadata = bricksPayload.metadata || {};
        const streamsMetadata = streamsPayload.metadata || {};
        const rootGroups = bricksPayload.rootGroups || bricksPayload.bricks || [];
        const streamRootGroups = streamsPayload.rootGroups || [];
        const explicitStreams = streamsPayload.streams || [];
        const brickRendering = bricksMetadata.rendering || bricksMetadata.render || {};
        const brickTypes = bricksMetadata.brickTypes || [];
        const brickStatuses = bricksMetadata.brickStatuses || [];
        const modulesConfig = bricksMetadata.modulesConfig || {};
        const typeColorMap = {};
        const statusMap = {};
        let brickStatusControlsInitialized = false;
        let dependenciesInitialized = false;
        let activeDependencySubtab = 'declared';
        let dataShowBricks = false;
        let dataShowDetail = false;
        const dependencySelectionState = {
            declared: {
                streamIds: null,
                typeIds: null
            },
            data: {
                brickIds: null,
                assetIds: null,
                aggregate: false
            },
            streams: {
                brickIds: null,
                streamIds: null,
                aggregate: false
            }
        };
        let matrixInitialized = false;

        brickTypes.forEach(type => {
            typeColorMap[type.id.toLowerCase()] = type;
            typeColorMap[type.name.toLowerCase()] = type;
        });

        brickStatuses.forEach(status => {
            if (status.id) {
                statusMap[String(status.id).toLowerCase()] = status;
            }
            if (status.name) {
                statusMap[String(status.name).toLowerCase()] = status;
            }
        });

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            flowchart: {
                htmlLabels: false
            }
        });

        function colorOf(type) {
            if (type && typeColorMap[type.toLowerCase()]) {
                return typeColorMap[type.toLowerCase()].color;
            }
            return 'var(--surface-fallback)';
        }

        function normalizeStatus(value) {
            return String(value || '').trim().toLowerCase();
        }

        function statusDefinitionOf(status) {
            const normalized = normalizeStatus(status);
            return statusMap[normalized] || {
                id: normalized || 'unspecified',
                name: status || 'unspecified',
                color: '#6b7280'
            };
        }

        function statusColorOf(status) {
            return statusDefinitionOf(status).color || '#6b7280';
        }

        function slugify(value) {
            const normalized = String(value || '').trim().toLowerCase();
            let output = '';
            let lastDash = false;
            for (const ch of normalized) {
                if ((ch >= 'a' && ch <= 'z') || (ch >= '0' && ch <= '9')) {
                    output += ch;
                    lastDash = false;
                } else if (!lastDash) {
                    output += '-';
                    lastDash = true;
                }
            }
            return output.replace(/^-+|-+$/g, '');
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeBrick(item) {
            return {
                ...item,
                color: colorOf(item.type),
                isHighlighted: Boolean(item.name && item.name.includes('*'))
            };
        }

        function normalizeGroup(group) {
            return {
                ...group,
                subGroups: (group.subGroups || []).map(normalizeGroup),
                bricks: (group.bricks || []).map(normalizeBrick)
            };
        }

        const configuredLayerTypes = modulesConfig.layerTypes || [];
        const moduleLayerOrder = configuredLayerTypes.length
            ? configuredLayerTypes.map(layer => layer.id).filter(Boolean)
            : ['ui', 'interfaces', 'worker', 'stateless-service', 'service', 'integration'];
        const moduleLayerLabels = configuredLayerTypes.reduce((lookup, layer) => {
            lookup[layer.id] = layer.name || layer.id;
            return lookup;
        }, {
            'ui': 'UI',
            'interfaces': 'Interfaces',
            'worker': 'Worker',
            'stateless-service': 'Stateless Service',
            'service': 'Service',
            'integration': 'Integration'
        });
        const moduleTypeDefinitions = (modulesConfig.moduleTypes || []).reduce((lookup, moduleType) => {
            if (moduleType && moduleType.id) {
                lookup[moduleType.id] = moduleType;
            }
            return lookup;
        }, {});

        function moduleLayerLabel(layerId) {
            return moduleLayerLabels[layerId] || String(layerId || '').replaceAll('-', ' ');
        }

        function moduleLayerClass(layerId) {
            return 'structure-' + slugify(layerId || 'service');
        }

        function moduleTypeColor(moduleTypeId) {
            const moduleType = moduleTypeDefinitions[String(moduleTypeId || '').toLowerCase()] || {};
            return moduleType.color || '#f3f4f6';
        }

        function normalizeLayerModules(layerId, layerConfig) {
            const modules = layerConfig && layerConfig.modules ? layerConfig.modules : {};
            if (Array.isArray(modules)) {
                return modules.map((module, index) => {
                    const moduleInfo = module && typeof module === 'object' ? module : { title: String(module || '') };
                    return {
                        ...moduleInfo,
                        layerId,
                        layerLabel: moduleLayerLabel(layerId),
                        displayName: moduleInfo.title || moduleInfo.name || moduleInfo.id || moduleLayerLabel(layerId) + ' module ' + (index + 1)
                    };
                });
            }
            return Object.entries(modules).map(([moduleName, module]) => {
                const moduleInfo = module && typeof module === 'object' ? module : { title: String(module || '') };
                return {
                    ...moduleInfo,
                    layerId,
                    layerLabel: moduleLayerLabel(layerId),
                    displayName: moduleInfo.title || moduleInfo.name || moduleInfo.id || moduleName
                };
            });
        }

        function layerItemsOf(brick) {
            const layers = brick.layers || [];
            if (Array.isArray(layers)) {
                return [
                    ...layers.filter(layer => moduleLayerOrder.includes(layer.layer)),
                    ...layers.filter(layer => !moduleLayerOrder.includes(layer.layer))
                ].sort((left, right) => {
                    const leftIndex = moduleLayerOrder.includes(left.layer) ? moduleLayerOrder.indexOf(left.layer) : moduleLayerOrder.length;
                    const rightIndex = moduleLayerOrder.includes(right.layer) ? moduleLayerOrder.indexOf(right.layer) : moduleLayerOrder.length;
                    return leftIndex - rightIndex || String(left.layer || '').localeCompare(String(right.layer || ''));
                });
            }
            return [
                ...moduleLayerOrder.filter(layerId => layers[layerId]).map(layerId => ({ layer: layerId, ...layers[layerId] })),
                ...Object.keys(layers).filter(layerId => !moduleLayerOrder.includes(layerId)).map(layerId => ({ layer: layerId, ...layers[layerId] }))
            ];
        }

        function layeredModulesOf(brick) {
            return layerItemsOf(brick).flatMap(layer => normalizeLayerModules(layer.layer, layer));
        }

        function moduleByIdForBrick(brick, moduleId) {
            if (!moduleId) {
                return null;
            }
            return layeredModulesOf(brick || {}).find(module => module.id === moduleId) || null;
        }

        function moduleNameForBrick(brick, moduleId) {
            const moduleInfo = moduleByIdForBrick(brick, moduleId);
            if (!moduleInfo) {
                return moduleId || '';
            }
            return moduleInfo.displayName || moduleInfo.name || moduleInfo.id || moduleId;
        }

        function brickDependencyEdgeLabel(sourceBrick, targetBrick, dependency) {
            const dependencyType = dependency.type || 'unspecified';
            const sourceModule = moduleNameForBrick(sourceBrick, dependency.sourceModuleId);
            const targetModule = moduleNameForBrick(targetBrick, dependency.moduleId);
            const modulePath = [sourceModule, targetModule].filter(Boolean).join(' -> ');
            return [dependencyType, modulePath].filter(Boolean).join(' / ');
        }

        function dataDependencyModuleNames(brick, dependency) {
            const moduleIds = Array.isArray(dependency.moduleIds) ? dependency.moduleIds : (dependency.moduleIds ? [dependency.moduleIds] : []);
            return moduleIds.map(moduleId => moduleNameForBrick(brick, moduleId)).filter(Boolean).join(', ');
        }

        function shouldShowBrickStructure() {
            const toggle = document.getElementById('brickStructureToggle');
            return !toggle || toggle.checked;
        }

        function shouldShowBrickStatus() {
            const toggle = document.getElementById('brickStatusToggle');
            return Boolean(toggle && toggle.checked);
        }

        function getBrickStatusOptions() {
            const counts = {};
            getBrickCatalog().forEach(brick => {
                const statusId = normalizeStatus(brick.status) || 'unspecified';
                counts[statusId] = (counts[statusId] || 0) + 1;
            });
            const options = brickStatuses.map(status => {
                const statusId = normalizeStatus(status.id || status.name);
                return {
                    id: statusId,
                    name: status.name || status.id || statusId,
                    color: status.color || '#6b7280',
                    count: counts[statusId] || 0
                };
            });
            Object.keys(counts).forEach(statusId => {
                if (!options.some(option => option.id === statusId)) {
                    const status = statusDefinitionOf(statusId);
                    options.push({
                        id: statusId,
                        name: status.name || statusId,
                        color: status.color || '#6b7280',
                        count: counts[statusId] || 0
                    });
                }
            });
            return options;
        }

        function ensureBrickStatusControls() {
            const container = document.getElementById('BrickStatusFilters');
            if (!container || brickStatusControlsInitialized) {
                return;
            }
            const options = getBrickStatusOptions();
            if (!options.length) {
                container.style.display = 'none';
                brickStatusControlsInitialized = true;
                return;
            }
            container.innerHTML = options.map(status => {
                const id = 'brickStatusFilter_' + status.id;
                return `
                    <label class="bricks-toggle bricks-status-filter" for="${escapeHtml(id)}">
                        <input type="checkbox" class="brick-status-filter-input" id="${escapeHtml(id)}" value="${escapeHtml(status.id)}" checked onchange="updateBricksView()">
                        <span class="status-swatch" style="background-color: ${escapeHtml(status.color)}"></span>
                        <span>${escapeHtml(status.name)} (${status.count})</span>
                    </label>
                `;
            }).join('');
            brickStatusControlsInitialized = true;
        }

        function selectedBrickStatuses() {
            const checkboxes = Array.from(document.querySelectorAll('.brick-status-filter-input'));
            if (!checkboxes.length) {
                return new Set(getBrickStatusOptions().map(status => status.id));
            }
            return new Set(checkboxes.filter(input => input.checked).map(input => normalizeStatus(input.value)));
        }

        function brickSearchQuery() {
            const input = document.getElementById('BrickSearch');
            return input ? input.value.trim().toLowerCase() : '';
        }

        function brickMatchesSearch(item, query) {
            if (!query) return true;
            const haystack = [item.id, item.name, item.description, item.type, item.status]
                .filter(Boolean).join(' ').toLowerCase();
            return haystack.includes(query);
        }

        function shouldRenderBrick(item) {
            return selectedBrickStatuses().has(normalizeStatus(item.status) || 'unspecified')
                && brickMatchesSearch(item, brickSearchQuery());
        }

        function statusBorderStyle(item) {
            if (!shouldShowBrickStatus()) {
                return '';
            }
            return `border-color: ${statusColorOf(item.status)}; border-width: 3px;`;
        }

        function renderBrick(item) {
            const structureCards = layeredModulesOf(item);
            const structureMarkup = shouldShowBrickStructure() && structureCards.length
                ? `<div class="brick-structure-list">${structureCards.map(structure => `
                    <div class="brick-structure-card ${escapeHtml(moduleLayerClass(structure.layerId))}" style="" title="${escapeHtml(structure.layerLabel + ': ' + structure.displayName)}">
                        <div class="structure-card-type">${escapeHtml(structure.type || structure.layerLabel)}</div>
                        <div>${escapeHtml(structure.displayName)}</div>
                    </div>
                `).join('')}</div>`
                : '';
            const brickCard = `
                <div class="brick-card${item.isHighlighted ? ' highlighted' : ''}" style="background-color: ${item.color}; ${statusBorderStyle(item)}">
                    <div class="brick-card-main">
                        <img class="brick-icon" src="icons/${item.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <div class="brick-name">
                            <div class="brick-name-title">${item.name || ''}</div>
                        </div>
                    </div>
                    ${structureMarkup}
                </div>
            `;

            if (!item.id) {
                return brickCard;
            }

            return `<a target="_blank" href="landing_pages/${item.id}.html">${brickCard}</a>`;
        }

        function renderGroup(group) {
            const renderedSubGroups = (group.subGroups || []).map(renderGroup).join('');
            const renderedBricks = (group.bricks || []).map(renderBrick).join('');
            return `
                <div class="group">
                    <div class="group-title">${group.name}</div>
                    <div class="group-items">${renderedSubGroups}${renderedBricks}</div>
                </div>
            `;
        }

        function renderDomain(domain) {
            return `
                <section class="domain-column">
                    <div class="domain-title">${domain.name}</div>
                    <div class="domain-groups">${(domain.subGroups || []).map(renderGroup).join('')}${(domain.bricks || []).map(renderBrick).join('')}</div>
                </section>
            `;
        }

        function buildGroupRowLookup() {
            const lookup = {};
            ((brickRendering.rows) || []).forEach(rowInfo => {
                const row = Number(rowInfo.row) || 1;
                (rowInfo.rootGroupNames || rowInfo.groupNames || rowInfo.brickIds || []).forEach(groupName => {
                    lookup[slugify(groupName)] = row;
                });
            });
            return lookup;
        }

        function applyRowsToHierarchy(items, groupRows) {
            return items.map(group => ({
                ...normalizeGroup(group),
                row: groupRows[slugify(group.name)] || Number(group.row) || 1
            }));
        }

        function filterGroupByStatus(group) {
            const subGroups = (group.subGroups || [])
                .map(filterGroupByStatus)
                .filter(Boolean);
            const bricks = (group.bricks || []).filter(shouldRenderBrick);
            if (!subGroups.length && !bricks.length) {
                return null;
            }
            return {
                ...group,
                subGroups,
                bricks
            };
        }

        function filterHierarchyForRow(items, targetRow) {
            return items.filter(group => group.row === targetRow);
        }

        function renderMap(items) {
            const groupRows = buildGroupRowLookup();
            const normalizedItems = applyRowsToHierarchy(items, groupRows)
                .map(filterGroupByStatus)
                .filter(Boolean);
            const rows = Array.from(new Set(
                Object.values(groupRows)
                    .map(value => Number(value) || 1)
                    .concat([1])
            )).sort((left, right) => left - right);

            if (!normalizedItems.length) {
                return '<div class="empty-state">No bricks match the current search and status filters.</div>';
            }

            return `
                <div class="map">
                    ${rows.map(row => {
                const rowItems = filterHierarchyForRow(normalizedItems, row);
                if (!rowItems.length) {
                    return '';
                }
                return `
                            <div class="map-row" data-row="${row}">
                                ${rowItems.map(renderDomain).join('')}
                            </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        function renderLegend() {
            return `
                <div class="legend-title">Legend:</div>
                ${brickTypes.map(type => `
                    <div class="legend-item" style="background-color: ${type.color}">${type.name}</div>
                `).join('')}
            `;
        }

        function escapeMermaidLabel(value) {
            return String(value || '')
                .replaceAll('&', 'and')
                .replaceAll('"', '')
                .replaceAll("'", '')
                .replaceAll('<', '')
                .replaceAll('>', '')
                .replaceAll('[', '(')
                .replaceAll(']', ')')
                .replaceAll('{', '(')
                .replaceAll('}', ')')
                .replaceAll('|', '/');
        }

        function flattenBricks(groups, ancestors = []) {
            let leaves = [];
            (groups || []).forEach(group => {
                const nextAncestors = ancestors.concat(group);
                leaves = leaves.concat(flattenBricks(group.subGroups || [], nextAncestors));
                const domain = nextAncestors[0] ? nextAncestors[0].name : '';
                const groupName = nextAncestors.length ? nextAncestors[nextAncestors.length - 1].name : '';
                (group.bricks || []).forEach(item => {
                    leaves.push({
                        ...item,
                        domain: domain,
                        group: groupName
                    });
                });
            });
            return leaves;
        }

        function getBrickCatalog() {
            return flattenBricks(rootGroups);
        }

        function getStreamCatalogItems() {
            const fallbackStreams = getBrickCatalog().map(item => ({
                ...item,
                sourceType: 'brick-fallback'
            }));

            return explicitStreams.length ? explicitStreams : fallbackStreams;
        }

        function normalizeStreamGroups(groups) {
            return (groups || []).map(group => ({
                ...group,
                subGroups: normalizeStreamGroups(group.subGroups || []),
                streams: (group.streams || []).map(item => ({
                    ...item,
                    group: item.group || group.name,
                    rootGroup: item.rootGroup || ''
                }))
            }));
        }

        function buildBrickLookup() {
            const lookup = {};
            getBrickCatalog().forEach(item => {
                lookup[item.id] = item;
            });
            return lookup;
        }

        function streamAreaOf(stream, brickLookup) {
            if (stream.group) {
                return stream.group;
            }
            const groups = {};
            (stream.brickDependencies || []).forEach(dep => {
                const brick = brickLookup[dep.targetBrickId] || {};
                const area = brick.group || brick.domain || 'General';
                groups[area] = (groups[area] || 0) + 1;
            });
            const ranked = Object.entries(groups).sort((left, right) => {
                if (right[1] !== left[1]) {
                    return right[1] - left[1];
                }
                return left[0].localeCompare(right[0]);
            });
            return ranked.length ? ranked[0][0] : 'General';
        }

        function renderStreamPills(stream, brickLookup) {
            const brickPills = (stream.brickDependencies || []).map(dep => {
                if (!dep.targetBrickId) {
                    return '';
                }
                const brick = brickLookup[dep.targetBrickId] || {};
                const pillColor = colorOf(brick.type);
                return `
                    <a class="stream-pill" style="background-color: ${pillColor}; border-color: rgba(17,17,17,0.12);" target="_blank" href="landing_pages/${dep.targetBrickId}.html" title="${dep.description || ''}">
                        <img src="icons/${dep.targetBrickId}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <span>${brick.name || dep.targetBrickId}</span>
                    </a>
                `;
            }).filter(Boolean).join('');

            return `
                <div class="stream-pills">${brickPills || ''}</div>
            `;
        }

        function renderStreamsView() {
            const container = document.getElementById('StreamsContent');
            if (!container) {
                return;
            }
            const descriptionToggle = document.getElementById('streamDescriptionToggle');
            const showDescriptions = Boolean(descriptionToggle && descriptionToggle.checked);

            const streams = getStreamCatalogItems();
            const brickLookup = buildBrickLookup();
            const grouped = {};
            streams.forEach(stream => {
                const area = streamAreaOf(stream, brickLookup);
                if (!grouped[area]) {
                    grouped[area] = [];
                }
                grouped[area].push(stream);
            });

            function summarizeStreamStory(stream) {
                const firstFlow = (stream.flows || [])[0] || {};
                const firstStep = (firstFlow.steps || [])[0] || {};
                const actor = firstFlow.primaryActor || firstStep.actor || '';
                const trigger = firstFlow.trigger || firstStep.trigger || '';
                return {actor, trigger};
            }

            function renderStreamCard(stream) {
                const story = summarizeStreamStory(stream);
                return `
                    <div class="stream-card" id="stream-${stream.id}">
                        <div class="stream-card-header">
                            <img class="stream-card-icon" src="icons/${stream.icon || 'stream.png'}" alt="" onerror="this.onerror=null;this.src='icons/stream.png'">
                            <div class="stream-card-title"><a target="_blank" href="stream_pages/${stream.id}.html">${stream.name || stream.id}</a></div>
                        </div>
                        ${showDescriptions && stream.description ? `<div class="stream-card-copy">${stream.description}</div>` : ''}
                        ${story.actor ? `<div class="stream-card-copy"><strong>Actor:</strong> ${story.actor}</div>` : ''}
                        ${story.trigger ? `<div class="stream-card-copy"><strong>Trigger:</strong> ${story.trigger}</div>` : ''}
                        ${renderStreamPills(stream, brickLookup)}
                    </div>
                `;
            }

            function renderStreamGroup(group, depth = 0) {
                const childGroups = (group.subGroups || []).map(item => renderStreamGroup(item, depth + 1)).join('');
                const cards = (group.streams || []).map(renderStreamCard).join('');
                const titleClass = depth === 0 ? 'stream-area-title' : 'stream-group-title';
                return `
                    <div class="stream-area stream-depth-${depth}">
                        <div class="${titleClass}">${group.name}</div>
                        ${showDescriptions && group.description ? `<div class="stream-group-copy">${group.description}</div>` : ''}
                        ${childGroups}
                        ${cards ? `<div class="stream-grid">${cards}</div>` : ''}
                    </div>
                `;
            }

            function buildBrickUsage() {
                const usage = {};
                streams.forEach(stream => {
                    (stream.brickDependencies || []).forEach(dep => {
                        if (!dep.targetBrickId) {
                            return;
                        }
                        if (!usage[dep.targetBrickId]) {
                            usage[dep.targetBrickId] = [];
                        }
                        usage[dep.targetBrickId].push(stream);
                    });
                });
                return usage;
            }

            function renderBrickAuditItem(brick, linkedStreams) {
                const pillColor = colorOf(brick.type);
                const meta = linkedStreams.length
                    ? linkedStreams.map(item => item.name || item.id).join(', ')
                    : 'Not linked to any stream.';
                return `
                    <a class="stream-pill" style="background-color: ${pillColor}; border-color: rgba(17,17,17,0.12);" target="_blank" href="landing_pages/${brick.id}.html" title="${meta}">
                        <img src="icons/${brick.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <span>${brick.name || brick.id}</span>
                    </a>
                `;
            }

            const hierarchicalGroups = normalizeStreamGroups(streamRootGroups);
            const brickUsage = buildBrickUsage();
            const unusedBricks = getBrickCatalog().filter(brick => !brickUsage[brick.id]);
            const reusedBricks = getBrickCatalog().filter(brick => (brickUsage[brick.id] || []).length >= 2);
            container.innerHTML = `
                ${hierarchicalGroups.length
                ? hierarchicalGroups.map(group => renderStreamGroup(group)).join('')
                : Object.keys(grouped).sort((left, right) => left.localeCompare(right)).map(area => `
                        <div class="stream-area">
                            <div class="stream-area-title">${area}</div>
                            <div class="stream-grid">
                                ${grouped[area].map(renderStreamCard).join('')}
                            </div>
                        </div>
                    `).join('')}
                <div class="stream-area">
                    <div class="stream-area-title">Bricks Not Part Of Any Stream</div>
                    ${showDescriptions ? '<div class="stream-group-copy">Implementation bricks currently not linked from any stream.</div>' : ''}
                    <div class="stream-pills">${unusedBricks.length ? unusedBricks.map(brick => renderBrickAuditItem(brick, [])).join('') : '<span class="activity-muted">Every brick is linked to at least one stream.</span>'}</div>
                </div>
                <div class="stream-area">
                    <div class="stream-area-title">Bricks In Two Or More Streams</div>
                    ${showDescriptions ? '<div class="stream-group-copy">Implementation bricks reused across multiple streams.</div>' : ''}
                    <div class="stream-pills">${reusedBricks.length ? reusedBricks.map(brick => renderBrickAuditItem(brick, brickUsage[brick.id] || [])).join('') : '<span class="activity-muted">No bricks are shared across two or more streams.</span>'}</div>
                </div>
            `;
        }

        function buildDataAssetUsage(assetId) {
            const producingBricks = [];
            const consumingBricks = [];

            getBrickCatalog().forEach(brick => {
                (brick.dataDependencies || []).forEach(dep => {
                    if (dep.assetId !== assetId) {
                        return;
                    }
                    const role = String(dep.role || '').toLowerCase();
                    if (['own', 'write', 'publish', 'replicate', 'delete'].includes(role)) {
                        producingBricks.push({
                            id: brick.id,
                            name: brick.name,
                            role: dep.role || '',
                            description: dep.description || ''
                        });
                    } else {
                        consumingBricks.push({
                            id: brick.id,
                            name: brick.name,
                            role: dep.role || '',
                            description: dep.description || ''
                        });
                    }
                });
            });

            return {producingBricks, consumingBricks};
        }

        function renderDataBrickPills(items, borderColor, actionIcon) {
            if (!items.length) {
                return '<span class="activity-muted">None linked.</span>';
            }

            return `
                <div class="stream-pills">
                    ${items.map(item => {

                        return `
                        <a class="stream-pill" style="background-color: ${pillColor}; border: 3px solid ${borderColor};" target="_blank" href="landing_pages/${item.id}.html" title="${escapeHtml(item.description || item.role || '')}">
                            <img src="icons/${actionIcon}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <img src="icons/${item.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <span>${item.name}</span>
                        </a>
                    `;
                    }).join('')}
                </div>
            `;

        function flattenDataAssetGroups(groups) {
            let assets = [];
            (groups || []).forEach(group => {
                assets = assets.concat(group.assets || []);
                assets = assets.concat(flattenDataAssetGroups(group.subGroups || []));
            });
            return assets;
        }

        function sortByDisplayName(left, right) {
            return (left.name || left.id || '').localeCompare(right.name || right.id || '');
        }

        function getAllDataAssets() {
            const assetGroups = dataAssetsPayload.rootGroups || [];
            return dataAssetsPayload.assets || flattenDataAssetGroups(assetGroups);
        }

        function getDeclaredDependencyCatalog() {
            const streams = getStreamCatalogItems().slice().sort(sortByDisplayName);
            const bricks = getBrickCatalog().slice().sort(sortByDisplayName);
            const dependencyTypes = new Set();
            bricks.forEach(brick => {
                (brick.brickDependencies || []).forEach(dep => {
                    if (dep.targetBrickId) {
                        dependencyTypes.add(dep.type || 'unspecified');
                    }
                });
            });
            return {
                streams,
                bricks,
                dependencyTypes: Array.from(dependencyTypes).sort((left, right) => left.localeCompare(right))
            };
        }

        function getDataDependencyCatalog() {
            const assetLookup = {};
            getAllDataAssets().forEach(asset => {
                if (asset.id) {
                    assetLookup[asset.id] = asset;
                }
            });

            const referencedAssetIds = new Set();
            const bricks = getBrickCatalog().filter(brick => {
                const dependencies = brick.dataDependencies || [];
                dependencies.forEach(dep => {
                    if (dep.assetId) {
                        referencedAssetIds.add(dep.assetId);
                    }
                });
                return dependencies.some(dep => dep.assetId);
            }).sort(sortByDisplayName);

            const assets = Array.from(referencedAssetIds).map(assetId => {
                return assetLookup[assetId] || {
                    id: assetId,
                    name: assetId,
                    kind: 'unlisted'
                };
            }).sort(sortByDisplayName);

            return {bricks, assets};
        }

        function getStreamDependencyCatalog() {
            const streams = getStreamCatalogItems().slice().sort(sortByDisplayName);
            const referencedBrickIds = new Set();
            streams.forEach(stream => {
                (stream.brickDependencies || []).forEach(dep => {
                    if (dep.targetBrickId) {
                        referencedBrickIds.add(dep.targetBrickId);
                    }
                });
            });
            const bricks = getBrickCatalog()
                .filter(brick => referencedBrickIds.has(brick.id))
                .sort(sortByDisplayName);
            return {streams, bricks};
        }
