<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Productscapes</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17302e;background:#f3f6f3}
body{max-width:1120px;margin:auto;padding:3rem 1.5rem}h1{font-size:3rem;margin:0}
header p{color:#49625e;max-width:48rem;line-height:1.6}h2{margin-top:3rem}
ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;padding:0;list-style:none}
li{background:white;border:1px solid #d9e3dd;border-radius:12px;padding:1.4rem}
a{color:#176953;font-weight:650;text-decoration:none}a:hover,a:focus{text-decoration:underline}
li p{font-size:.94rem;line-height:1.55;color:#49625e;margin-bottom:0}
</style>
<header><h1>Productscapes</h1><p>Explore product strategy through customers, jobs to be done, products, product bricks, teams, and competition.</p></header>
<main>${domains}</main>
</html>
